<!-- Customer Portal Header -->
<header class="portal-header">
    <div class="container">
        <div class="header-content">
            <div class="header-left">
                <button class="sidebar-toggle" id="sidebarToggle" aria-label="Toggle Navigation">
                    <span class="hamburger-line"></span>
                    <span class="hamburger-line"></span>
                    <span class="hamburger-line"></span>
                </button>
            </div>
            <div class="user-section" id="user-section" style="display: none;">
                <!-- Language Switcher -->
                <div class="language-switcher">
                    <button class="language-btn" id="languageBtn" title="Change Language">
                        <i class="fas fa-globe"></i>
                        <span id="currentLanguage">EN</span>
                    </button>
                    <div class="language-dropdown" id="languageDropdown">
                        <div class="language-option" data-lang="en">
                            <i class="fas fa-flag-usa"></i>
                            <span>English</span>
                        </div>
                        <div class="language-option" data-lang="pt">
                            <i class="fas fa-flag"></i>
                            <span>Português</span>
                        </div>
                    </div>
                </div>
                
                <button class="logout-btn" onclick="performCustomerLogout()" title="Logout" data-translate="Logout">
                    <i class="fas fa-sign-out-alt"></i>
                    <span data-translate="Logout">Logout</span>
                </button>
            </div>
        </div>
    </div>
</header>

<script>
// Complete print implementation that doesn't depend on external files
function printDocument(doctype, name) {
    // Show loading indicator
    if (typeof frappe !== 'undefined' && frappe.show_alert) {
        frappe.show_alert('Preparing document for printing...', 2);
    }
    
    // Call the print API
    if (typeof frappe !== 'undefined' && frappe.call) {
        frappe.call({
            method: 'isoft_customer_portal.api.print_document',
            args: {
                doc_type: doctype,
                doc_name: name
            },
            callback: (r) => {
                if (r.message && r.message.print_format) {
                    // Build print URL
                    let baseUrl = window.location.origin;
                    let printUrl = baseUrl + '/printview?' +
                        'doctype=' + encodeURIComponent(doctype) +
                        '&name=' + encodeURIComponent(name) +
                        '&trigger_print=1' +
                        '&format=' + encodeURIComponent(r.message.print_format) +
                        '&no_letterhead=0';
                    
                    // Add language if available
                    if (frappe.lang_code) {
                        printUrl += '&_lang=' + frappe.lang_code;
                    }
                    
                    let w = window.open(printUrl, '_blank');

                    if (!w) {
                        if (typeof frappe !== 'undefined' && frappe.msgprint) {
                            frappe.msgprint('Please enable pop-ups for printing.');
                        } else {
                            alert('Please enable pop-ups for printing.');
                        }
                        return;
                    }
                    
                    // Show success message
                    if (typeof frappe !== 'undefined' && frappe.show_alert) {
                        frappe.show_alert('Document opened for printing', 2);
                    }
                    
                } else if (r.message && r.message.error) {
                    showError(r.message.error);
                } else {
                    showError('Failed to get print format from settings');
                }
            },
            error: (err) => {
                showError('Failed to print document. Please try again.');
            }
        });
    } else {
        showError('Frappe framework not available. Please refresh the page.');
    }
}

// Error display function
function showError(message) {
    if (typeof frappe !== 'undefined' && frappe.msgprint) {
        frappe.msgprint(message);
    } else {
        alert(message);
    }
}

// Global fallback function for any cached references to the old function
window.printDocumentWithCustomURLDebug = function(doctype, name, format = null) {
    // Redirect to the new print function
    printDocument(doctype, name);
};

// Create the isoft_customer_portal namespace if it doesn't exist and add printDocument fallback
window.isoft_customer_portal = window.isoft_customer_portal || {};
if (!window.isoft_customer_portal.printDocument) {
    window.isoft_customer_portal.printDocument = function(doctype, name) {
        // Use the local printDocument function as fallback
        printDocument(doctype, name);
    };
}

// Also create safePrintDocument as a global fallback
window.safePrintDocument = window.safePrintDocument || function(docType, docName) {
    if (window.isoft_customer_portal && window.isoft_customer_portal.printDocument) {
        window.isoft_customer_portal.printDocument(docType, docName);
    } else {
        // Use the local printDocument function as fallback
        printDocument(docType, docName);
    }
};

// Function to perform customer logout
function performCustomerLogout() {
    // Show loading state
    const logoutBtn = document.querySelector('.logout-btn');
    if (logoutBtn) {
        const originalText = logoutBtn.innerHTML;
        logoutBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i><span>Logging out...</span>';
        logoutBtn.disabled = true;
    }
    
    // Clear client-side data immediately
    try {
        // Clear localStorage
        localStorage.removeItem('customer_data');
        localStorage.clear();
        
        // Clear sessionStorage
        sessionStorage.clear();
        
        // Clear any frappe-specific data
        if (typeof frappe !== 'undefined') {
            if (frappe.session && typeof frappe.session.clear === 'function') {
                frappe.session.clear();
            }
            if (frappe.cache && typeof frappe.cache.clear === 'function') {
                frappe.cache.clear();
            }
            if (frappe.user) {
                frappe.user = null;
            }
        }
    } catch (e) {
        console.log('Client-side cleanup error:', e);
    }
    
    // Call logout API and then redirect
    if (typeof frappe !== 'undefined' && frappe.call) {
        frappe.call({
            method: 'isoft_customer_portal.api.customer_logout',
            callback: function(r) {
                // Redirect regardless of API response
                window.location.href = '/customer-logout';
            },
            error: function(r) {
                // Redirect even if API fails
                window.location.href = '/customer-logout';
            }
        });
    } else {
        // Fallback using jQuery if frappe.call is not available
        $.ajax({
            url: '/api/method/isoft_customer_portal.api.customer_logout',
            type: 'POST',
            dataType: 'json',
            complete: function() {
                // Redirect regardless of response
                window.location.href = '/customer-logout';
            }
        });
    }
    
    // Fallback redirect in case API call fails completely
    setTimeout(function() {
        if (window.location.pathname !== '/customer-logout') {
            window.location.href = '/customer-logout';
        }
    }, 2000);
}

// Check authentication and show/hide elements accordingly
document.addEventListener('DOMContentLoaded', function() {
    // Check if we're on logout/login pages and hide sidebar
    const currentPath = window.location.pathname;
    
    if (currentPath.includes('logout') || currentPath.includes('login')) {
        // Hide sidebar on logout/login pages
        const sidebar = document.getElementById('modernSidebar');
        const overlay = document.getElementById('sidebarOverlay');
        if (sidebar) {
            sidebar.style.display = 'none';
        }
        if (overlay) {
            overlay.style.display = 'none';
        }
        
        // Hide sidebar toggle button
        const toggleBtn = document.getElementById('sidebarToggle');
        if (toggleBtn) {
            toggleBtn.style.display = 'none';
        }
    }
    
    // Check if user is authenticated
    frappe.call({
        method: 'isoft_customer_portal.api.check_customer_auth',
        callback: function(r) {
            
            if (r.message && r.message.authenticated) {
                // User is authenticated - show user section
                document.getElementById('user-section').style.display = 'flex';
                
                // Load customer name
                frappe.call({
                    method: 'isoft_customer_portal.api.get_customer_name',
                    callback: function(r) {
                        if (r.message) {
                            const customerNameElement = document.getElementById('customer-name');
                            if (customerNameElement) {
                                customerNameElement.textContent = r.message;
                            }
                        }
                    },
                    error: function(r) {
                        //
                    }
                });
            } else {
                // User is not authenticated - hide user section and redirect to login if on protected page
                document.getElementById('user-section').style.display = 'none';
                
                // Check if we're on a protected page and redirect to login
                const currentPath = window.location.pathname;
                const protectedPages = ['/customer-dashboard', '/customer-invoices', '/customer-ledger', 
                                     '/customer-quotations', '/customer-sales-orders', '/customer-delivery-notes', 
                                     '/customer-payment-entries'];
                
                if (protectedPages.some(page => currentPath.includes(page))) {
                    window.location.href = '/customer-login';
                }
            }
        },
        error: function(r) {
            // Error occurred - hide user section
            document.getElementById('user-section').style.display = 'none';
        }
    });
});


</script>
